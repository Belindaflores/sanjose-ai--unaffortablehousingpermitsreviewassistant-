openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: permit-applications
    description: Persistent permit application records
  - name: county-public-records
    description: Public records imported from the County of Santa Clara Open Data portal
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /permit-applications:
    get:
      operationId: listPermitApplications
      tags: [permit-applications]
      summary: List saved permit applications
      description: Returns saved permit applications newest first. Applicant demo views can filter by email; this is not authentication.
      parameters:
        - name: applicantEmail
          in: query
          required: false
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Saved permit applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermitApplication"
    post:
      operationId: createPermitApplication
      tags: [permit-applications]
      summary: Save a screened permit application
      description: Persists applicant input and the rule-based pre-screening output.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermitApplication"
      responses:
        "201":
          description: Saved permit application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermitApplication"
        "409":
          description: An application with this ID already exists
  /permit-applications/{id}:
    patch:
      operationId: updatePermitApplication
      tags: [permit-applications]
      summary: Update a saved permit application
      description: Persists County staff review actions and notes for an application.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermitApplication"
      responses:
        "200":
          description: Updated permit application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermitApplication"
        "404":
          description: Saved permit application not found
  /county-public-records:
    get:
      operationId: listCountyPublicRecords
      tags: [county-public-records]
      summary: List imported County public plan-check records
      description: Returns records imported from the County of Santa Clara Open Data SCC Plan Check Progress dataset.
      responses:
        "200":
          description: County public records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountyPublicRecord"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PermitDocument:
      type: object
      properties:
        category:
          type: string
        label:
          type: string
        required:
          type: boolean
        received:
          type: boolean
        fileName:
          type: string
        receivedAt:
          type: string
          format: date-time
      required: [category, label, required, received]
    PermitTimelineEvent:
      type: object
      properties:
        label:
          type: string
        status:
          type: string
          enum: [completed, current, upcoming]
        date:
          type: string
        detail:
          type: string
      required: [label, status, date, detail]
    PermitStaffNote:
      type: object
      properties:
        id:
          type: string
        author:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, author, body, createdAt]
    PermitApplication:
      type: object
      properties:
        id:
          type: string
        dataSource:
          type: string
          enum: [Prototype Submission, Synthetic]
        applicantName:
          type: string
        companyName:
          type: string
        email:
          type: string
          format: email
        projectName:
          type: string
        projectAddress:
          type: string
        permitType:
          type: string
        projectType:
          type: string
        housingUnits:
          type: integer
        affordableHousing:
          type: boolean
        underservedCommunity:
          type: boolean
        estimatedCost:
          type: number
        description:
          type: string
        submittedAt:
          type: string
          format: date-time
        aiStatus:
          type: string
          enum:
            - Ready for Human Review
            - Missing Information
            - Potential Issues Detected
            - Additional Agency Review Required
        priority:
          type: string
          enum: [Normal, High, Urgent]
        assignedDepartment:
          type: string
        reviewStatus:
          type: string
          enum:
            - New
            - In County Intake
            - Ready for Review
            - More Information Requested
            - Planning Review
            - Building Review
            - Fire Review
            - Environmental Review
            - Senior Review
            - Approved
            - Denied
            - Revisions Required
        completenessScore:
          type: integer
          minimum: 0
          maximum: 100
        documents:
          type: array
          items:
            $ref: "#/components/schemas/PermitDocument"
        flags:
          type: array
          items:
            type: string
        aiSummary:
          type: string
        recommendedRouting:
          type: array
          items:
            type: string
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/PermitTimelineEvent"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/PermitStaffNote"
      required:
        - id
        - applicantName
        - companyName
        - email
        - projectName
        - projectAddress
        - permitType
        - projectType
        - housingUnits
        - affordableHousing
        - underservedCommunity
        - estimatedCost
        - description
        - submittedAt
        - aiStatus
        - priority
        - assignedDepartment
        - reviewStatus
        - completenessScore
        - documents
        - flags
        - aiSummary
        - recommendedRouting
        - timeline
        - notes
    CountyPublicRecord:
      type: object
      properties:
        sourceRecordId:
          type: string
        dataSource:
          type: string
          enum: [County of Santa Clara Open Data]
        datasetName:
          type: string
        sourceUrl:
          type: string
          format: uri
        businessName:
          type: ["string", "null"]
        siteLocation:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        receivedDate:
          type: ["string", "null"]
          format: date
        dueDate:
          type: ["string", "null"]
          format: date
        revisionRequestedDate:
          type: ["string", "null"]
          format: date
        revisionSubmittedDate:
          type: ["string", "null"]
          format: date
        latestRevisionRequestedDate:
          type: ["string", "null"]
          format: date
        latestRevisionSubmittedDate:
          type: ["string", "null"]
          format: date
        planApprovedDate:
          type: ["string", "null"]
          format: date
        preliminaryInspectionDate:
          type: ["string", "null"]
          format: date
        finalInspectionDate:
          type: ["string", "null"]
          format: date
        serviceCompleteDate:
          type: ["string", "null"]
          format: date
      required:
        - sourceRecordId
        - dataSource
        - datasetName
        - sourceUrl
        - businessName
        - siteLocation
        - city
        - receivedDate
        - dueDate
        - revisionRequestedDate
        - revisionSubmittedDate
        - latestRevisionRequestedDate
        - latestRevisionSubmittedDate
        - planApprovedDate
        - preliminaryInspectionDate
        - finalInspectionDate
        - serviceCompleteDate

