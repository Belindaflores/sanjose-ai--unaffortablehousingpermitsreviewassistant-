openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - AppPasscode: []
tags:
  - name: health
    description: Health operations
  - name: permit-applications
    description: Persistent permit application records
  - name: county-public-records
    description: Public records imported from the County of Santa Clara Open Data portal
  - name: saved-applications
    description: Private saved drafts; never official submissions
paths:
  /app-access/session:
    get:
      security: []
      operationId: getAppAccessSession
      responses:
        "200":
          description: Browser-session app access status, without any secret values
          content:
            application/json:
              schema:
                type: object
                required: [unlocked, configured]
                properties:
                  unlocked: { type: boolean }
                  configured: { type: boolean }
  /app-access/unlock:
    post:
      security: []
      operationId: unlockAppAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passcode]
              properties:
                passcode: { type: string, pattern: '^[0-9]{4}$' }
      responses:
        "200":
          description: Sets an HttpOnly browser-session access cookie
          content:
            application/json:
              schema:
                type: object
                required: [unlocked]
                properties:
                  unlocked: { type: boolean }
        "400":
          description: Passcode must contain exactly four numeric digits
        "401":
          description: Incorrect passcode
        "403":
          description: Cross-origin or non-JSON request rejected
        "429":
          description: Too many failed attempts
        "503":
          description: Secret is missing or invalid; access remains locked
  /saved-applications:
    get:
      operationId: listSavedApplications
      tags: [saved-applications]
      responses:
        "200":
          description: Saved drafts owned by the signed-in account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedApplication"
  /saved-applications/{id}:
    patch:
      operationId: updateSavedApplication
      tags: [saved-applications]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedApplicationChanges"
      responses:
        "200":
          description: Updated saved draft belonging to the signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedApplication"
  /portal-session:
    post:
      operationId: selectPortalRole
      summary: Select a prototype portal after unlocking with the app passcode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [applicant, worker] }
              required: [role]
      responses:
        "200":
          description: Selected shared prototype portal profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUser"
        "401":
          description: The app passcode is required
        "403":
          description: Cross-origin requests are not allowed
    delete:
      operationId: exitPortal
      summary: Clear the selected portal without clearing the app passcode session
      responses:
        "204":
          description: Portal selection cleared
  /portal-user:
    get:
      operationId: getPortalUser
      responses:
        "200":
          description: Profile for the server-signed portal selection after passcode entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUser"
    post:
      operationId: requestStaffAccess
      responses:
        "200":
          description: Staff access requested, never automatically granted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUser"
  /permit-rule-config:
    get:
      operationId: getPermitRuleConfig
      responses:
        "200":
          description: Underserved area matching configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermitRuleConfig"
    put:
      operationId: updatePermitRuleConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermitRuleConfig"
      responses:
        "200":
          description: Staff-updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermitRuleConfig"
  /permit-applications/{id}/intake-analysis:
    post:
      operationId: analyzePermitIntake
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Application with saved advisory intake analysis (or explicit analysis failure)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermitApplication" }
        "403": { description: Staff access required }
        "404": { description: Application not found }
        "409": { description: Analysis already running }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      responses:
        "410":
          description: Actual file uploads are disabled; use the simulated document-status toggles
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
  /storage/objects/{objectPath}:
    get:
      operationId: downloadPermitDocument
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Private document available only to its owner or staff }
  /permit-applications/{id}/review-checks:
    post:
      operationId: reviewPermitChecks
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [claim, safety, jurisdiction] }
                claim: { type: string, enum: [affordable, underserved] }
                decision: { type: string, enum: [Verified, Rejected] }
                document: { type: string }
                note: { type: string, minLength: 1, maxLength: 2000 }
              required: [action, note]
      responses:
        "200":
          description: Staff decision recorded with authenticated identity and timestamp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermitApplication"
  /permit-applications/{id}/classification:
    patch:
      operationId: correctPermitClassification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectType: { type: string, minLength: 1 }
                housingUnits: { type: integer, minimum: 0 }
                description: { type: string, minLength: 1 }
              required: [projectType, housingUnits, description]
      responses:
        "200":
          description: Re-screened classification correction by owner or staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermitApplication"
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /permit-applications:
    get:
      operationId: listPermitApplications
      tags: [permit-applications]
      summary: List saved permit applications
      description: Authenticated applicants receive only records owned by their user ID. Staff can review all in-county submissions.
      parameters:
        - name: applicantEmail
          in: query
          required: false
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Saved permit applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermitApplication"
    post:
      operationId: createPermitApplication
      tags: [permit-applications]
      summary: Save a screened permit application
      description: Validates jurisdiction, claims, safety and consistency server-side. Client screening output is not trusted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermitApplication"
      responses:
        "201":
          description: Saved permit application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermitApplication"
        "409":
          description: An application with this ID already exists
        "422":
          description: Outside County jurisdiction or missing required supporting evidence. No County record created.
  /permit-applications/{id}:
    patch:
      operationId: updatePermitApplication
      tags: [permit-applications]
      summary: Update a saved permit application
      description: Persists County staff review actions and notes for an application.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermitApplication"
      responses:
        "200":
          description: Updated permit application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermitApplication"
        "404":
          description: Saved permit application not found
  /county-public-records:
    get:
      operationId: listCountyPublicRecords
      tags: [county-public-records]
      summary: List imported County public plan-check records
      description: Returns records imported from the County of Santa Clara Open Data SCC Plan Check Progress dataset.
      responses:
        "200":
          description: County public records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountyPublicRecord"
components:
  securitySchemes:
    AppPasscode:
      type: apiKey
      in: cookie
      name: scc_app_access
      description: Signed HttpOnly browser-session cookie obtained by entering APP_PASSCODE. Existing account and role checks still apply.
  schemas:
    SavedApplication:
      type: object
      properties:
        id: { type: string }
        applicationNumber: { type: string }
        applicantEmail: { type: string, format: email }
        accountOwner: { type: string }
        applicantName: { type: string }
        address: { type: string }
        projectName: { type: string }
        projectAddress: { type: string }
        applicationType: { type: string }
        status: { type: string, enum: [Draft, In progress, Action needed, Submitted] }
        submissionDate: { type: ["string", "null"], format: date-time }
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/AccountTimelineEvent"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/AccountDocument"
        description: { type: string }
        dateSaved: { type: string, format: date-time }
        lastUpdated: { type: string, format: date-time }
      required: [id, applicationNumber, applicantEmail, accountOwner, applicantName, address, projectName, projectAddress, applicationType, status, description, dateSaved, lastUpdated, submissionDate, timeline, documents]
    AccountTimelineEvent:
      type: object
      properties:
        label: { type: string }
        date: { type: ["string", "null"], format: date-time }
        status: { type: string, enum: [complete, upcoming] }
      required: [label, date, status]
    AccountDocument:
      type: object
      properties:
        name: { type: string }
        fileName: { type: string }
        category: { type: string }
        required: { type: boolean }
        uploadStatus: { type: string, enum: [Received] }
        uploadDate: { type: string, format: date-time }
        fileType: { type: string }
        fileSize: { type: integer, minimum: 0 }
        synthetic: { type: boolean }
      required: [name, fileName, category, required, uploadStatus, uploadDate, fileType, fileSize, synthetic]
    SavedApplicationChanges:
      type: object
      properties:
        projectName: { type: string, minLength: 1, maxLength: 180 }
        projectAddress: { type: string, minLength: 1, maxLength: 240 }
        applicationType: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
      required: [projectName, projectAddress, applicationType, description]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PermitDocument:
      type: object
      properties:
        category:
          type: string
        label:
          type: string
        required:
          type: boolean
        received:
          type: boolean
        fileName:
          type: string
        objectPath:
          type: string
        receivedAt:
          type: string
          format: date-time
      required: [category, label, required, received]
    PermitTimelineEvent:
      type: object
      properties:
        label:
          type: string
        status:
          type: string
          enum: [completed, current, upcoming]
        date:
          type: string
        detail:
          type: string
      required: [label, status, date, detail]
    PermitStaffNote:
      type: object
      properties:
        id:
          type: string
        author:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, author, body, createdAt]
    IntakeEvidence:
      type: object
      properties:
        source: { type: string, enum: [Application, Checklist, Derived] }
        sourceField: { type: string }
        quote: { type: string }
        documentName: { type: ["string", "null"] }
        page: { type: ["integer", "null"] }
      required: [source, sourceField, quote, documentName, page]
    IntakeFinding:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: ["string", "null"] }
        confidence: { type: string, enum: [HIGH, MEDIUM, LOW] }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/IntakeEvidence" }
        note: { type: string }
      required: [key, label, value, confidence, evidence, note]
    IntakeDocument:
      type: object
      properties:
        label: { type: string }
        category: { type: string }
        submitted: { type: boolean }
        fields:
          type: array
          items: { $ref: "#/components/schemas/IntakeFinding" }
      required: [label, category, submitted, fields]
    IntakeAnalysis:
      type: object
      properties:
        status: { type: string, enum: [completed, failed] }
        mode: { type: string, enum: [application-only] }
        analyzedAt: { type: string }
        model: { type: string }
        error: { type: ["string", "null"] }
        fields:
          type: array
          items: { $ref: "#/components/schemas/IntakeFinding" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/IntakeDocument" }
        actualDocumentsAnalyzed: { type: integer }
        checklistSubmitted: { type: integer }
        requiredDocumentsExpected: { type: integer }
        missingRequired: { type: integer }
        potentialDocumentMismatches: { type: ["integer", "null"] }
        needsStaffVerification: { type: integer }
      required: [status, mode, analyzedAt, model, error, fields, documents, actualDocumentsAnalyzed, checklistSubmitted, requiredDocumentsExpected, missingRequired, potentialDocumentMismatches, needsStaffVerification]
    PermitApplication:
      type: object
      properties:
        id:
          type: string
        ownerUserId: { type: ["string", "null"] }
        claimed_affordable: { type: boolean }
        claimed_underserved: { type: boolean }
        censusTract: { type: string }
        verification_status: { type: string, enum: [Unverified, Verified, Rejected] }
        priorityClaims: { $ref: "#/components/schemas/PriorityClaims" }
        reviewDecisions: { $ref: "#/components/schemas/ReviewDecisions" }
        ruleChecks: { $ref: "#/components/schemas/RuleChecks" }
        requiredReviewers:
          type: array
          items: { type: string }
        dataSource:
          type: string
          enum: [Prototype Submission, Synthetic]
        applicantName:
          type: string
        companyName:
          type: string
        email:
          type: string
          format: email
        projectName:
          type: string
        projectAddress:
          type: string
        permitType:
          type: string
        projectType:
          type: string
        housingUnits:
          type: integer
          minimum: 0
        affordableHousing:
          type: boolean
        underservedCommunity:
          type: boolean
        estimatedCost:
          type: number
        description:
          type: string
        submittedAt:
          type: string
          format: date-time
        aiStatus:
          type: string
          enum:
            - Ready for Human Review
            - Missing Information
            - Potential Issues Detected
            - Additional Agency Review Required
        priority:
          type: string
          enum: [Normal, High, Urgent]
        assignedDepartment:
          type: string
        reviewStatus:
          type: string
          enum:
            - New
            - In County Intake
            - Ready for Review
            - More Information Requested
            - Planning Review
            - Building Review
            - Fire Review
            - Environmental Review
            - Senior Review
            - Approved
            - Denied
            - Revisions Required
            - Needs Jurisdiction Verification
            - Blocked — Safety Review Required
            - Needs Human Review — Data Inconsistency
        completenessScore:
          type: integer
          minimum: 0
          maximum: 100
        documents:
          type: array
          items:
            $ref: "#/components/schemas/PermitDocument"
        flags:
          type: array
          items:
            type: string
        aiSummary:
          type: string
        intakeAnalysis:
          anyOf:
            - $ref: "#/components/schemas/IntakeAnalysis"
            - type: "null"
        recommendedRouting:
          type: array
          items:
            type: string
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/PermitTimelineEvent"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/PermitStaffNote"
      required:
        - id
        - applicantName
        - companyName
        - email
        - projectName
        - projectAddress
        - permitType
        - projectType
        - housingUnits
        - affordableHousing
        - underservedCommunity
        - estimatedCost
        - description
        - submittedAt
        - aiStatus
        - priority
        - assignedDepartment
        - reviewStatus
        - completenessScore
        - documents
        - flags
        - aiSummary
        - recommendedRouting
        - timeline
        - notes
    AuditDecision:
      type: object
      properties:
        note: { type: string }
        by: { type: string }
        at: { type: string }
        document: { type: string }
      required: [note, by, at]
    ClaimVerification:
      type: object
      properties:
        status: { type: string, enum: [Unverified, Verified, Rejected] }
        note: { type: string }
        by: { type: string }
        at: { type: string }
      required: [status]
    PriorityClaims:
      type: object
      properties:
        affordable: { $ref: "#/components/schemas/ClaimVerification" }
        underserved: { $ref: "#/components/schemas/ClaimVerification" }
      required: [affordable, underserved]
    ReviewDecisions:
      type: object
      properties:
        jurisdiction: { $ref: "#/components/schemas/AuditDecision" }
        safety:
          type: array
          items: { $ref: "#/components/schemas/SafetyDecision" }
    SafetyDecision:
      type: object
      properties:
        note: { type: string }
        by: { type: string }
        at: { type: string }
        document: { type: string }
      required: [note, by, at, document]
    RuleChecks:
      type: object
      properties:
        jurisdictionStatus: { type: string, enum: [In County, Needs Verification, Outside County] }
        classificationConflicts: { type: array, items: { type: string } }
        safetyCriticalFlags: { type: array, items: { type: string } }
        underservedMatch: { type: string }
        completenessLabel: { type: string }
      required: [jurisdictionStatus, classificationConflicts, safetyCriticalFlags, underservedMatch, completenessLabel]
    PortalUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [applicant, worker, fire_marshal] }
        staffAccessRequested: { type: boolean }
      required: [id, email, name, role, staffAccessRequested]
    PermitRuleConfig:
      type: object
      properties:
        zips: { type: array, items: { type: string, pattern: "^\\d{5}$" } }
        censusTracts: { type: array, items: { type: string } }
        placeholder: { type: boolean }
        updateNote: { type: string, minLength: 1 }
        updatedBy: { type: string }
        updatedAt: { type: string }
      required: [zips, censusTracts, placeholder]
    PublicHousingPermitDetails:
      type: object
      properties:
        permitNumber: { type: string }
        projectType: { type: string }
        workDescription: { type: string }
        dwellingUnits: { type: integer, minimum: 1 }
        status: { type: string }
        issuedDate: { type: ["string", "null"], format: date }
        finalDate: { type: ["string", "null"], format: date }
        permitValuation: { type: ["number", "null"] }
      required: [permitNumber, projectType, workDescription, dwellingUnits, status, issuedDate, finalDate, permitValuation]
    CountyPublicRecord:
      type: object
      properties:
        sourceRecordId:
          type: string
        dataSource:
          type: string
          enum: [County of Santa Clara Open Data, City of San Jose Open Data]
        datasetName:
          type: string
        sourceUrl:
          type: string
          format: uri
        housingDetails:
          anyOf:
            - $ref: "#/components/schemas/PublicHousingPermitDetails"
            - type: "null"
        businessName:
          type: ["string", "null"]
        siteLocation:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        receivedDate:
          type: ["string", "null"]
          format: date
        dueDate:
          type: ["string", "null"]
          format: date
        revisionRequestedDate:
          type: ["string", "null"]
          format: date
        revisionSubmittedDate:
          type: ["string", "null"]
          format: date
        latestRevisionRequestedDate:
          type: ["string", "null"]
          format: date
        latestRevisionSubmittedDate:
          type: ["string", "null"]
          format: date
        planApprovedDate:
          type: ["string", "null"]
          format: date
        preliminaryInspectionDate:
          type: ["string", "null"]
          format: date
        finalInspectionDate:
          type: ["string", "null"]
          format: date
        serviceCompleteDate:
          type: ["string", "null"]
          format: date
      required:
        - sourceRecordId
        - dataSource
        - datasetName
        - sourceUrl
        - businessName
        - siteLocation
        - city
        - receivedDate
        - dueDate
        - revisionRequestedDate
        - revisionSubmittedDate
        - latestRevisionRequestedDate
        - latestRevisionSubmittedDate
        - planApprovedDate
        - preliminaryInspectionDate
        - finalInspectionDate
        - serviceCompleteDate

